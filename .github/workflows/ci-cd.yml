name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Run tests
      run: npm test -- --coverage
    
    - name: Check coverage threshold
      run: |
        COVERAGE=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
        if (( $(echo "$COVERAGE < 20" | bc -l) )); then
          echo "Coverage $COVERAGE% is below 20%"
          exit 1
        fi
        echo "Coverage: $COVERAGE%"

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        cd deployment
        docker build -f docker/Dockerfile -t student-blogging:latest ../..
    
    - name: Test Docker image
      run: |
        docker run -d --name test-api -p 3000:3000 student-blogging:latest
        sleep 10
        docker logs test-api
        docker stop test-api